<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#1F2A3A"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#13B9FD" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <style>
      .name { font: 800 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
      .role { font: 500 24px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8B949E; letter-spacing: 1px; }
      .tag  { font: 600 15px 'Courier New', monospace; fill: #ffffff; }
      .fade { animation: fade 1.2s ease-out both; }
      .fade2 { animation: fade 1.2s ease-out 0.4s both; }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- decorative circles -->
  <circle class="float" cx="1080" cy="70" r="90" fill="#ffffff" opacity="0.06"/>
  <circle class="float" cx="140" cy="250" r="70" fill="#13B9FD" opacity="0.12"/>


  <!-- waves -->
  <path d="M0 240 C 200 200, 400 290, 600 245 S 1000 200, 1200 250 L1200 300 L0 300 Z" fill="url(#wave)"/>
  <path d="M0 265 C 250 235, 450 300, 700 268 S 1050 240, 1200 272 L1200 300 L0 300 Z" fill="#ffffff" opacity="0.08"/>

  <!-- Flutter-style logo mark -->
  <g transform="translate(990 60) scale(1.2)" opacity="0.9">
    <polygon points="60,0 90,0 30,60 15,45" fill="#54C5F8"/>
    <polygon points="60,55 90,55 60,85 45,70" fill="#54C5F8"/>
    <polygon points="45,70 60,85 90,115 60,115 30,85" fill="#01579B"/>
    <polygon points="30,85 45,70 60,85 45,100" fill="#29B6F6"/>
  </g>

  <g>
    <text x="80" y="135" class="name">Mohamed Shaduli</text>
  </g>
  <g>
    <text x="82" y="178" class="role">Flutter Developer  •  Android &amp; iOS  •  Meridian IT Solutions</text>
    <rect x="82" y="200" rx="14" width="270" height="30" fill="#ffffff" opacity="0.15"/>
    <text x="98" y="221" class="tag">&lt;/&gt;  Calicut, Kerala, India</text>
  </g>
</svg>
